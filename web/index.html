<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abhay's Rasterizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button
      type="button"
      id="help-toggle"
      class="help-toggle"
      aria-label="How to interact"
      title="How to interact"
    >
      ?
    </button>

    <div class="page">
      <header class="site-header">
        <h1>Abhay's Rasterizer</h1>
      </header>

      <p id="load-status" class="load-status">Loading rasterizer…</p>

      <div class="viewer-wrap">
        <div class="canvas-frame">
          <canvas id="canvas" tabindex="-1"></canvas>
        </div>
      </div>

      <section class="controls-panel" aria-label="Viewer controls">
        <div class="ctrl-row">
          <span class="ctrl-heading">Scene</span>
          <span class="ctrl-vrule" aria-hidden="true"></span>
          <div class="ctrl-body">
            <div class="ctrl-field">
              <label for="model-select">Model</label>
              <select id="model-select" aria-label="Model">
                <option value="0" selected>Venus</option>
                <option value="1">Spaceship</option>
                <option value="2">Skull</option>
                <option value="3">Terrorpin</option>
                <option value="4">Plane</option>
                <option value="5">User Upload</option>
              </select>
            </div>
            <div class="ctrl-field">
              <label for="mode-select">Render Mode</label>
              <select id="mode-select" aria-label="Render Mode">
                <option value="0">Wireframe</option>
                <option value="1">Flat</option>
                <option value="2">Gouraud</option>
                <option value="3" selected>Phong</option>
              </select>
            </div>
          </div>
          <button type="button" id="upload-btn" class="ctrl-action">Upload Model</button>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-heading">View</span>
          <span class="ctrl-vrule" aria-hidden="true"></span>
          <div class="ctrl-body">
            <div class="ctrl-field ctrl-field--slider">
              <label for="light-slider">Light Angle</label>
              <input
                id="light-slider"
                class="ctrl-range"
                type="range"
                min="0"
                max="6.283185307179586"
                step="0.01"
                value="0"
                aria-label="Light direction angle"
              />
              <span id="light-value" class="ctrl-value">0°</span>
            </div>
          </div>
          <button type="button" id="overlay-toggle-btn" class="ctrl-action">Toggle Overlay</button>
        </div>
      </section>

      <footer class="site-footer">
        <a href="https://github.com/melchior729" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com/in/abhaymanoj729" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </footer>
    </div>

    <div id="upload-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="upload-title">
      <div class="modal">
        <h3 id="upload-title">Upload model</h3>
        <p>Provide an OBJ file. MTL and texture images are optional.</p>
        <form id="upload-form">
          <div class="field">
            <label for="obj-file">OBJ file (required)</label>
            <input id="obj-file" name="obj" type="file" accept=".obj" required />
          </div>
          <div class="field">
            <label for="mtl-file">MTL file (optional)</label>
            <input id="mtl-file" name="mtl" type="file" accept=".mtl" />
          </div>
          <div class="field">
            <label for="texture-files">Textures (optional)</label>
            <input id="texture-files" name="textures" type="file" accept="image/*" multiple />
          </div>
          <p class="modal-note">Upload parsing is coming in the next phase.</p>
          <div class="modal-actions">
            <button type="button" class="secondary" id="upload-cancel">Cancel</button>
            <button type="submit">Upload</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
    <script async src="rasterizer.js"></script>
  </body>
</html>
